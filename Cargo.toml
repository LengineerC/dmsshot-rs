[package]
name = "dmsshot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
calloop = "0.14.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.5", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
libc = "0.2.186"
# paddleocr_rs_onnx 0.2.7 uses APIs removed by ort rc.13.
ort = "=2.0.0-rc.12"
paddleocr_rs_onnx = "=0.2.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21.1"
thiserror = "2.0.19"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[profile.release]
lto = "thin"
strip = true
